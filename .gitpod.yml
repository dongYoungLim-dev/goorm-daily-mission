# =============================================================================
# Gitpod 워크스페이스 설정 (260207_daily_Streamlit 앱용)
# Gitpod은 이 파일을 저장소 루트에서만 읽습니다.
# =============================================================================

# image: 워크스페이스에서 사용할 Docker 이미지
# Python 3.11이 미리 설치된 공식 Gitpod 이미지를 사용합니다.
image: gitpod/workspace-python-3.11

# ports: 워크스페이스에서 외부에 노출할 포트 목록
# Streamlit 기본 포트 8501을 열고, 워크스페이스 오픈 시 브라우저에서 자동으로 엽니다.
ports:
  - port: 8501
    name: Streamlit
    onOpen: open-browser

# tasks: 워크스페이스가 시작될 때 실행할 작업
# - init: 워크스페이스 최초 빌드 시 한 번만 실행 (의존성 설치 등)
# - command: init 이후 매번 터미널에서 실행할 명령 (Streamlit 서버 기동)
tasks:
  - name: Streamlit 앱 실행
    # init: 260207_daily_Streamlit 폴더의 requirements.txt로 패키지 설치
    init: pip install -r 260207_daily_Streamlit/requirements.txt
    # command: Streamlit 앱을 8501 포트에서 실행
    # --server.address=0.0.0.0 은 Gitpod 컨테이너 밖(브라우저)에서 접속하려면 필수입니다.
    # 기본값(127.0.0.1)이면 로컬에서만 접속 가능해 원격 URL로 접속이 되지 않습니다.
    command: streamlit run 260207_daily_Streamlit/streamlit_dev.py --server.port=8501 --server.address=0.0.0.0
